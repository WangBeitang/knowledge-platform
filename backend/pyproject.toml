[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-platform-backend"
version = "0.1.0"
description = "券商财富业务知识管理平台后端（FastAPI 单体）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# SQLAlchemy 全局异步引擎 + 连接池依赖稳定的运行循环：测试与夹具统一使用
# 会话级事件循环，避免“Event loop is closed”导致池内连接失效。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: 需要真实数据库连接的集成测试（数据库不可达自动跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入以 Depends()/Query() 作默认值是标准用法
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
