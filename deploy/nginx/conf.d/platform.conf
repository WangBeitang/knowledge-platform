# 宿主侧 Nginx：TLS 终止 + 反代到 frontend 容器（compose 仅暴露 127.0.0.1:8080）。
#
# 部署步骤：
#   1) 将本文件复制到宿主 /etc/nginx/conf.d/platform.conf；
#   2) 将 <your-domain> 替换为真实域名；
#   3) 把 TLS 证书放到 /etc/nginx/certs/（server.crt / server.key）；
#   4) nginx -t && systemctl reload nginx（或 nginx -s reload）。
#
# 公网入口统一由本 Nginx 的 80/443 提供；MySQL/Redis/backend/frontend
# 均不对公网监听（见 deploy/docker-compose.yml 暴露策略）。
# SSE（内部/外部流式问答）经 /api 反代：proxy_buffering off + 合理读超时。

limit_req_zone $binary_remote_addr zone=platform_zone:10m rate=20r/s;

upstream kp_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <your-domain>;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    # 平台前端（SPA）+ /api 反代：统一走 frontend 容器（其内部 /api 反代到 backend）
    location / {
        limit_req zone=platform_zone burst=40 nodelay;
        proxy_pass http://kp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE：禁用缓冲，避免流式回答被截断；读超时保持合理值
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 可选：直接暴露 backend 健康检查（无需前端容器中转）
    location /api/v1/health/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name <your-domain>;
    # HTTP → HTTPS
    return 301 https://$host$request_uri;
}
