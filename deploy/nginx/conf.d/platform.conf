# 宿主侧 Nginx：TLS 终止 + 反代到 frontend 容器（docker-compose 暴露 8080）。
# 部署时替换 <your-domain> 与证书路径（证书放到 /etc/nginx/certs/）。
# 基础限流：登录与外部接口另有应用层限流，此处仅做总体保护。

limit_req_zone $binary_remote_addr zone=platform_zone:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name <your-domain>;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        limit_req zone=platform_zone burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE：禁用缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name <your-domain>;
    return 301 https://$host$request_uri;
}
